<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bayline Metro Rolling Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #9cc6e6; overflow: hidden; font: 13px/1.4 "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; top: 10px; color: #fff; background: rgba(20, 26, 32, 0.62); padding: 8px 10px; border-radius: 8px; max-width: 560px; }
  #hud a { color: #ffd27a; margin-right: 8px; text-decoration: none; }
  #stats { opacity: 0.8; margin-top: 4px; }
  body.clean #hud { display: none; }
</style>
</head>
<body>
<div id="hud"><b>Bayline Metro rolling stock</b> · drag to orbit, wheel to zoom · <code>&amp;meta=1</code> walking metadata · <code>&amp;clean=1</code> no HUD<br>
  <span id="links"></span><div id="stats"></div></div>
<script src="../vendor/three.min.js"></script>
<script src="../src/js/00_util.js"></script>
<script src="../src/js/21_metronet.js"></script>
<script src="../src/js/41_metrokit.js"></script>
<script src="../src/js/42_metrokit_apm.js"></script>
<script src="../src/js/42_metrokit_bake.js"></script>
<script src="../src/js/42_metrokit_disp.js"></script>
<script src="../src/js/42_metrokit_dmu.js"></script>
<script src="../src/js/42_metrokit_far.js"></script>
<script src="../src/js/42_metrokit_fotf.js"></script>
<script src="../src/js/42_metrokit_int.js"></script>
<script>
(() => {
  const VIEWS = ['exterior', 'nose', 'front', 'cabside', 'threequarter', 'refint', 'side', 'doors', 'bogie', 'roof', 'ends', 'rear', 'interior', 'seated', 'cab', 'night-exterior', 'night-interior', 'night-nose',
    'lod', 'curve', 'dmu', 'apm'];
  const hp = new URLSearchParams(location.hash.slice(1));
  const view = hp.get('view') || 'exterior', showMeta = hp.get('meta') === '1';
  if (hp.get('clean') === '1') document.body.classList.add('clean');
  document.getElementById('links').innerHTML = VIEWS.map(v => `<a href="#view=${v}" onclick="setTimeout(()=>location.reload())">${v}</a>`).join('');
  const night = view.startsWith('night') || hp.get('night') === '1';
  const q = hp.get('q'); if (q !== null) MetroKit.setQuality(isNaN(+q) ? q : +q);

  const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
  if (MetroKit.setRenderer) MetroKit.setRenderer(renderer);                   // (baked LODs render their atlases with it)
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = night ? 1.1 : 0.9;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const inside = ['interior', 'seated', 'cab', 'night-interior', 'refint'].includes(view);
  const camera = new THREE.PerspectiveCamera(inside ? 66 : 40, innerWidth / innerHeight, 0.03, 60000);

  // sky dome + PMREM environment
  const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: {
      top: { value: new THREE.Color(night ? 0x040812 : 0x4f8fcf) }, hor: { value: new THREE.Color(night ? 0x16223a : 0xd6e6f0) },
      gnd: { value: new THREE.Color(night ? 0x0a0b0d : 0x7a7466) }, sun: { value: new THREE.Vector3(0.55, 0.42, 0.35).normalize() }, night: { value: night ? 1 : 0 } },
    vertexShader: '#include <common>\n#include <logdepthbuf_pars_vertex>\nvarying vec3 vd; void main(){ vd = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);\n#include <logdepthbuf_vertex>\n}',
    fragmentShader: `#include <common>\n#include <logdepthbuf_pars_fragment>\nuniform vec3 top, hor, gnd, sun; uniform float night; varying vec3 vd;
      void main(){ \n#include <logdepthbuf_fragment>\n float h = vd.y; vec3 c = h > 0.0 ? mix(hor, top, pow(h, 0.5)) : mix(hor, gnd, pow(-h, 0.35));
        float s = max(dot(vd, sun), 0.0); c += (night > 0.5 ? vec3(0.5,0.55,0.7) * pow(s, 900.0) : vec3(1.0,0.9,0.7) * (pow(s, 400.0) * 8.0 + pow(s, 8.0) * 0.25));
        // a few soft clouds so reflections have something to show
        float cl = smoothstep(0.55, 0.8, sin(vd.x * 9.0 + sin(vd.z * 7.0) * 2.0) * 0.5 + 0.5) * smoothstep(0.02, 0.3, h) * (1.0 - night);
        c = mix(c, vec3(0.95), cl * 0.35);
        gl_FragColor = vec4(c, 1.0); }` });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(20000, 32, 16), skyMat); scene.add(sky);
  const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), skyMat));
  // a dark ground band and a few buildings in the env so metal and glass reflect a horizon
  const envGround = new THREE.Mesh(new THREE.CylinderGeometry(90, 90, 20, 32, 1, true), new THREE.MeshBasicMaterial({ color: night ? 0x0b0c0e : 0x55524a, side: THREE.BackSide }));
  envGround.position.y = -8; envScene.add(envGround);
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, h = 3 + (i * 7919 % 13); const b = new THREE.Mesh(new THREE.BoxGeometry(12, h, 12), new THREE.MeshBasicMaterial({ color: night ? 0x141820 : (i % 3 ? 0x8c8a86 : 0xb8b4aa) }));
    b.position.set(Math.cos(a) * 80, h / 2 - 1, Math.sin(a) * 80); envScene.add(b); }
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(envScene, 0.02).texture;
  if (night) scene.environmentIntensity = 0.25;
  const hemi = new THREE.HemisphereLight(night ? 0x2a3a5a : 0xcfe4ff, night ? 0x1a1a14 : 0x8a7a55, night ? 0.2 : 0.9); scene.add(hemi);
  const sun = new THREE.DirectionalLight(night ? 0x8090b0 : 0xfff1dc, night ? 0.2 : 2.8); scene.add(sun, sun.target);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  sun.castShadow = !night; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.03;
  Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 400 });

  // ground, trackbed, broad-gauge rails, third rail with coverboard (left), platform at 0.991 m (right), 1.676 m edge
  const mat = (c, r = 0.9, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), mat(night ? 0x151412 : 0x9c9278, 1)); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.45; ground.receiveShadow = true; scene.add(ground);
  const curveView = view === 'curve';
  if (!curveView) {
    const bed = new THREE.Mesh(new THREE.BoxGeometry(700, 0.3, 4.6), mat(night ? 0x2a2926 : 0x837d72)); bed.position.y = -0.33; bed.receiveShadow = true; scene.add(bed);
    const ties = new THREE.InstancedMesh(new THREE.BoxGeometry(0.28, 0.2, 2.6), mat(night ? 0x3b3a38 : 0x9a968d, 0.85), 1100);
    const m4 = new THREE.Matrix4(); for (let i = 0; i < 1100; i++) { m4.makeTranslation(-330 + i * 0.6, -0.27, 0); ties.setMatrixAt(i, m4); } ties.receiveShadow = true; scene.add(ties);
    const railM = mat(0x8a8d90, 0.35, 0.9);
    for (const z of [-0.8745, 0.8745]) { const r = new THREE.Mesh(new THREE.BoxGeometry(700, 0.172, 0.073), railM); r.position.set(0, -0.086, z); r.castShadow = r.receiveShadow = true; scene.add(r); }
    // contact rail as infra builds it (notes/bart/infra.md): contact surface +0.171 over lat 1.461-1.537, coverboard
    // underside +0.239 / top +0.263 from lat 1.339 to 1.630, turned down to +0.181 on the field side
    const tr3 = new THREE.Mesh(new THREE.BoxGeometry(700, 0.2, 0.076), railM); tr3.position.set(0, 0.171 - 0.1, -1.499); scene.add(tr3);
    const coverM = mat(0xa9adad, 0.62);
    const cover = new THREE.Mesh(new THREE.BoxGeometry(700, 0.024, 0.291), coverM); cover.position.set(0, 0.251, -(1.339 + 1.630) / 2); cover.castShadow = true; scene.add(cover);
    const lip = new THREE.Mesh(new THREE.BoxGeometry(700, 0.082, 0.012), coverM); lip.position.set(0, (0.181 + 0.263) / 2, -1.624); scene.add(lip);
    const platLen = 214, px = -10;
    const plat = new THREE.Mesh(new THREE.BoxGeometry(platLen, 1.4, 6), mat(night ? 0x5b5955 : 0xc2beb4, 0.85)); plat.position.set(px, 0.991 - 0.7, 1.676 + 3); plat.receiveShadow = true; scene.add(plat);
    const tact = new THREE.Mesh(new THREE.BoxGeometry(platLen, 0.006, 0.6), mat(0xe5b21c, 0.6)); tact.position.set(px, 0.994, 1.676 + 0.3 + 0.02); scene.add(tact);
    if (night) for (let i = 0; i < 8; i++) { const l = new THREE.PointLight(0xffe2b0, 16, 24, 1.5); l.position.set(-90 + i * 25, 5, 5); scene.add(l); }
  }

  // ---------------------------------------------------------------- trains
  if (hp.get('q')) MetroKit.setQuality(hp.get('q'));                               // low | medium | high | ultra
  const isDmu = view === 'dmu', isApm = view === 'apm';
  const ncars = +(hp.get('cars') || (isDmu ? 1 : isApm ? 3 : (view === 'curve' || view === 'lod') ? 10 : 4));
  const c = MetroKit.createConsist(isDmu ? 'dmu' : isApm ? 'apm' : 'bart', { cars: ncars, seed: +(hp.get('seed') || 3), order: hp.get('order') || undefined });
  window.__c = c;
  c.setDestination({ line: hp.get('line') || 'yellow', text: hp.get('dest') || 'SF Airport' });
  c.setNight(night ? 1 : 0);
  c.setLights({ head: 1, tail: 1, interior: 1, lead: 'front' });
  if (c.setThirdRail) c.setThirdRail(view === 'curve' ? 0 : -1);          // the preview's contact rail is on the -Z side
  if (hp.get('load') && c.setLoad) c.setLoad(+hp.get('load'));
  if (hp.get('wet') && MetroKit.setWet) MetroKit.setWet(+hp.get('wet'));                // rain: 0..1
  const front = c.length / 2;
  const X = i => front - c.cars[i].offset;
  if (curveView) {
    // a 180 m radius curve with 0.10 m cant, the consist's front at the curve's middle
    const R = 180, cx = 0, cz = R;
    const frame = (d, out) => { const a = d / R; out.x = cx + R * Math.sin(a); out.z = cz - R * Math.cos(a); out.y = 0; out.tx = Math.cos(a); out.tz = Math.sin(a); out.bank = -0.06; return out; };
    MetroKit.poseOnTrack(c, frame, 60);
    // rails along the curve
    const pts = []; for (let d = -250; d <= 150; d += 2) { const f = frame(d, {}); pts.push(f); }
    const railM = mat(0x8a8d90, 0.35, 0.9), tieM = mat(0x9a968d, 0.85), n = pts.length;
    const ties = new THREE.InstancedMesh(new THREE.BoxGeometry(0.28, 0.2, 2.6), tieM, n * 4); let k = 0; const m4 = new THREE.Matrix4(), qq = new THREE.Quaternion();
    for (let d = -250; d <= 150; d += 0.6) { const f = frame(d, {}); qq.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.atan2(-f.tz, f.tx)); m4.compose(new THREE.Vector3(f.x, -0.27, f.z), qq, new THREE.Vector3(1, 1, 1)); if (k < n * 4) ties.setMatrixAt(k++, m4); }
    ties.count = k; ties.receiveShadow = true; scene.add(ties);
    for (const off of [-0.8745, 0.8745]) { const g = new THREE.BufferGeometry(), P = [];
      for (let i = 0; i < n - 1; i++) { const a = pts[i], b = pts[i + 1]; const ax = a.x - a.tz * off, az = a.z + a.tx * off, bx = b.x - b.tz * off, bz = b.z + b.tx * off;
        P.push(ax, 0, az, bx, 0, bz, bx, -0.17, bz, ax, 0, az, bx, -0.17, bz, ax, -0.17, az); }
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.computeVertexNormals(); const r = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x8a8d90, roughness: 0.35, metalness: 0.9, side: THREE.DoubleSide })); scene.add(r); }
  } else {
    for (const car of c.cars) car.group.position.set(front - car.offset, 0, 0);
  }
  for (const car of c.cars) scene.add(car.group);
  if (view === 'doors' || view === 'night-exterior' || hp.get('doors') === '1') { c.setDoors('right', 1); for (let i = 0; i < 60; i++) c.update(0.1); }
  if (inside || view === 'doors' || view === 'night-exterior') c.setInteriorVisible(true);
  if (view === 'lod') c.cars.forEach((car, i) => car.setLOD(i < 3 ? 0 : i < 6 ? 1 : 2));
  if (hp.get('lod')) c.setLOD(+hp.get('lod'));                                      // force a LOD (A/B the baked LODs)

  // walking metadata overlay (#meta=1)
  if (showMeta) for (const car of c.cars) {
    const g = new THREE.Group(); car.group.add(g);
    const col = new THREE.Color().setHSL((car.index * 0.17) % 1, 0.8, 0.5);
    for (const r of car.floorRegions) { const m = new THREE.Mesh(new THREE.BoxGeometry(r.x1 - r.x0, 0.02, r.z1 - r.z0), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.35, depthWrite: false }));
      m.position.set((r.x0 + r.x1) / 2, r.y + 0.03, (r.z0 + r.z1) / 2); g.add(m); }
    for (const s of car.seats) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 4), new THREE.MeshBasicMaterial({ color: 0x00ffaa })); m.position.set(s.x, s.y, s.z); g.add(m);
      const a = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.01, 0.01), new THREE.MeshBasicMaterial({ color: 0x00ffaa })); a.position.set(s.x + Math.cos(s.yaw) * 0.12, s.y, s.z - Math.sin(s.yaw) * 0.12); a.rotation.y = s.yaw; g.add(a); }
    for (const d of car.doors) { const m = new THREE.Mesh(new THREE.BoxGeometry(d.width, 0.04, 0.3), new THREE.MeshBasicMaterial({ color: 0xffff00 })); m.position.set(d.x, d.sillY, d.side * 1.5); g.add(m); }
    if (car.cabEye) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff0000 })); m.position.set(...car.cabEye); g.add(m); }
  }

  // ---------------------------------------------------------------- camera presets (world = car-local + X(i))
  const target = new THREE.Vector3();
  const set = (px, py, pz, tx, ty, tz) => { camera.position.set(px, py, pz); target.set(tx, ty, tz); camera.lookAt(target); };
  const x0 = X(0), L0 = c.cars[0].length / 2;
  switch (view) {
    case 'nose': set(x0 + L0 + 4.2, 2.1, 3.4, x0 + L0 - 0.3, 1.9, 0); break;
    case 'front': set(x0 + L0 + 8.5, 1.75, 1.0, x0 + L0 - 0.5, 2.05, 0.1); camera.fov = 36; break;
    case 'cabside': set(x0 + L0 + 3.5, 1.9, 6.5, x0 + L0 - 3.5, 1.8, 0.8); camera.fov = 44; break;
    case 'threequarter': set(x0 + L0 + 6.5, 2.4, 6.2, x0 + L0 - 6.0, 1.9, -0.4); camera.fov = 40; break;      // (the El Cerrito 2021 photo's angle)
    case 'refint': set(X(1) + 0.3, 0.991 + 1.45, 0.0, X(1) - 8, 0.991 + 1.25, 0.0); camera.fov = 68; break;  // (the March 2018 D-car interior photo's angle)
    case 'night-nose': set(x0 + L0 + 7, 1.9, 5.5, x0 + L0 - 1.2, 1.9, 0); break;
    case 'side': set(X(1) - 1, 1.75, -17, X(1) - 1, 1.95, 0); camera.fov = 44; break;
    case 'doors': set(X(1) - 3.2, 2.1, 6.3, X(1) - 5.8, 1.7, 1.0); break;
    case 'bogie': { const bx = X(1) + c.cars[1].bogieOffsets[0]; set(bx + 2.9, 0.65, -3.4, bx, 0.5, -0.8); camera.fov = 46; break; }
    case 'roof': set(X(1) + 6, 9.5, 8, X(1) + 2, 3.2, 0); break;
    case 'ends': set(X(0) - L0 + 1.9, 2.3, 4.6, X(0) - L0 - 0.4, 1.7, 0.6); break;
    case 'rear': { const n = c.cars.length - 1, xl = X(n) - c.cars[n].length / 2; set(xl - 13, 3.2, 9, xl + 4, 2.0, 0); break; }
    case 'interior': set(X(1) + 3.6, 0.991 + 1.62, 0.25, X(1) - 5, 0.991 + 1.35, -0.1); break;
    case 'night-interior': set(X(1) + 3.6, 0.991 + 1.62, 0.25, X(1) - 5, 0.991 + 1.35, -0.1); break;
    case 'seated': { const s = c.cars[1].seats[4]; set(X(1) + s.x, s.y, s.z, X(1) + s.x + Math.cos(s.yaw) * 5, s.y - 0.2, s.z - Math.sin(s.yaw) * 5); break; }
    case 'cab': { const e = c.cars[0].cabEye; set(x0 + e[0], e[1], e[2], x0 + e[0] + 10, e[1] - 1.6, e[2] - 0.9); camera.fov = 70; break; }
    case 'night-exterior': set(X(1) + 16, 2.2, 11, X(1) - 4, 1.9, 0); break;
    case 'lod': set(x0 + 30, 22, 70, x0 - 70, 2, 0); break;
    case 'curve': { const f = c.cars[4].group.position; set(f.x + 40, 26, f.z - 70, f.x - 10, 1.5, f.z + 10); break; }
    case 'dmu': case 'apm': set(x0 + L0 + 12, 3.2, 11, x0 - 4, 1.8, 0); break;
    default: set(x0 + L0 + 13, 2.9, 10.5, x0 - 3, 1.9, 0);
  }
  camera.updateProjectionMatrix();
  // orbit controls
  let drag = null; const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(target));
  addEventListener('pointerdown', e => drag = { x: e.clientX, y: e.clientY });
  addEventListener('pointerup', () => drag = null);
  addEventListener('pointermove', e => { if (!drag) return; sph.theta -= (e.clientX - drag.x) * 0.005; sph.phi = THREE.MathUtils.clamp(sph.phi - (e.clientY - drag.y) * 0.005, 0.05, 3.1); drag = { x: e.clientX, y: e.clientY };
    camera.position.copy(target).add(new THREE.Vector3().setFromSpherical(sph)); camera.lookAt(target); });
  addEventListener('wheel', e => { sph.radius = Math.max(0.3, sph.radius * (1 + e.deltaY * 0.001)); camera.position.copy(target).add(new THREE.Vector3().setFromSpherical(sph)); camera.lookAt(target); });
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

  let last = performance.now(), frames = 0;
  c.speed = +(hp.get('speed') || 0);
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t; U.uTime.value += dt;
    c.update(dt);
    sun.target.position.copy(target); sun.position.copy(target).add(new THREE.Vector3(60, 45, 38));
    renderer.render(scene, camera);
    if (++frames === 20) {
      const i = renderer.info.render, st = { view, calls: i.calls, tris: i.triangles, cars: c.cars.length, length: +c.length.toFixed(2),
        design: Object.values(MetroKit.designs).map(d => `${d.key}: ${d.tris || 0} tris, ${Math.round(d.buildMs)} ms`) };
      document.getElementById('stats').textContent = JSON.stringify(st); console.log('STATS ' + JSON.stringify(st));
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  // #gpu=1: frame time (render + gl.finish) with and without the consist, median of 40, logged as GPUTIME
  if (hp.get('gpu') === '1') setTimeout(() => {
    const gl = renderer.getContext();
    const sample = (n) => { const t = []; for (let i = 0; i < n; i++) { const t0 = performance.now(); renderer.render(scene, camera); gl.finish(); t.push(performance.now() - t0); } t.sort((a, b) => a - b); return t[Math.floor(n / 2)]; };
    sample(10); const on = sample(40); for (const car of c.cars) car.group.visible = false; const off = sample(40); for (const car of c.cars) car.group.visible = true;
    console.log('GPUTIME ' + JSON.stringify({ view, cars: c.cars.length, withTrain: +on.toFixed(2), without: +off.toFixed(2), train: +(on - off).toFixed(2) }));
  }, 2500);
  // #measure=1: draw calls / triangles of the consist alone (no scenery) per LOD and with interiors, logged as MEASURE
  if (hp.get('measure') === '1') setTimeout(() => {
    const keep = new Set(); for (const car of c.cars) keep.add(car.group);
    const hidden = []; scene.children.forEach(o => { if (!keep.has(o) && o.visible && !o.isLight) { o.visible = false; hidden.push(o); } });
    renderer.shadowMap.enabled = false;
    const cam2 = camera.clone(); cam2.position.set(0, 60, 260); cam2.lookAt(0, 0, 0); cam2.far = 2000; cam2.updateProjectionMatrix();
    const meas = (label) => { renderer.info.reset(); renderer.info.autoReset = false; renderer.render(scene, cam2); const r = { label, calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; renderer.info.autoReset = true; return r; };
    const out = [];
    c.setInteriorVisible(false); c.setLOD(0); out.push(meas('LOD0 exterior, ' + c.cars.length + ' cars'));
    c.cars[1].setInteriorVisible(true); out.push(meas('LOD0 + interior of car 1')); c.cars[0].setInteriorVisible(true); out.push(meas('LOD0 + interiors of cars 0 and 1')); c.setInteriorVisible(false);
    c.setLOD(1); out.push(meas('LOD1')); c.setLOD(2); out.push(meas('LOD2')); c.setLOD(0);
    const ds = Object.values(MetroKit.designs).map(d => ({ key: d.key, ext: d.tris, build: Math.round(d.buildMs), int: d.int ? d.int.tris : null, intBuild: d.int ? Math.round(d.int.buildMs) : null,
      lod1: d.lod1 ? d.lod1.index.count / 3 : null, lod2: d.lod2 ? d.lod2.index.count / 3 : null }));
    console.log('MEASURE ' + JSON.stringify({ out, designs: ds }));
    for (const o of hidden) o.visible = true; renderer.shadowMap.enabled = true;
  }, 1500);
  window.__scene = scene; window.__renderer = renderer; window.__camera = camera;
})();
</script>
</body>
</html>
