<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayline — sound preview</title>
<style>
  :root { color-scheme: dark; --bg: #11151b; --panel: #1b222c; --line: #2c3644; --ink: #e8ecf1; --dim: #97a3b3; --accent: #e5463b; --amber: #ffb547; }
  body { margin: 0; font: 14px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 18px 22px 8px; } h1 { margin: 0 0 4px; font-size: 20px; } header p { margin: 0; color: var(--dim); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding: 14px 22px 30px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; } label span { width: 90px; color: var(--dim); } label output { width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; }
  button { background: #28313d; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; margin: 3px 4px 3px 0; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--amber); } button.primary { background: var(--accent); border-color: var(--accent); }
  #meter { height: 8px; background: #0b0e12; border-radius: 4px; overflow: hidden; margin-top: 8px; } #meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #48c774, #ffb547, #e5463b); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; } td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; } th { color: var(--dim); font-weight: 600; }
  .ok { color: #48c774; } .bad { color: #ff6b5e; } #results { grid-column: 1 / -1; } pre { white-space: pre-wrap; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header><h1>Bayline sound preview</h1><p>Everything is synthesized live with the Web Audio API. Open with <code>#selftest</code> to run the offline render test.</p></header>
<main>
  <section>
    <h2>Engine</h2>
    <button class="primary" id="start">Start audio</button> <button id="mute">Mute</button>
    <label><span>Volume</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"><output></output></label>
    <label><span>Train</span><select id="kind"><option value="emu">EMU (electric)</option><option value="diesel">Diesel (South County)</option></select></label>
    <label><span>Speed m/s</span><input id="speed" type="range" min="0" max="40" step="0.1" value="0"><output></output></label>
    <label><span>Power</span><input id="power" type="range" min="-1" max="1" step="0.01" value="0"><output></output></label>
    <label><span>Curve</span><input id="curve" type="range" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label><span>Tunnel</span><input id="tunnel" type="range" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label><span>Distance m</span><input id="dist" type="range" min="0" max="400" step="1" value="10"><output></output></label>
    <label><span>Onboard</span><input id="onboard" type="checkbox"> <span>In cab</span><input id="incab" type="checkbox"> <span>Doors</span><input id="doors" type="checkbox"></label>
    <button id="auto">Auto run: depart, cruise, brake</button>
    <div id="meter"><i></i></div>
  </section>
  <section>
    <h2>Events</h2>
    <button id="horn">Horn (hold)</button> <button id="bell">Bell on/off</button> <button id="chime">Door chime</button><br>
    <label><span>Announce</span><input id="annText" value="Now arriving: Palo Alto. Doors will open on the right." style="flex:1"></label>
    <button id="announce">Announce</button>
    <h2 style="margin-top:14px">Grade crossing</h2>
    <label><span>Active</span><input id="xon" type="checkbox"></label>
    <label><span>Distance m</span><input id="xdist" type="range" min="2" max="600" step="1" value="40"><output></output></label>
    <h2 style="margin-top:14px">Pass-by</h2>
    <button id="passEmu">EMU passes</button> <button id="passDsl">Diesel passes</button> <label><span>Horn</span><input id="passHorn" type="checkbox" checked></label>
  </section>
  <section>
    <h2>Ambience</h2>
    <label><span>City</span><input class="amb" id="city" type="range" min="0" max="1" step="0.01" value="0.4"><output></output></label>
    <label><span>Bay</span><input class="amb" id="bay" type="range" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label><span>Wind</span><input class="amb" id="wind" type="range" min="0" max="1" step="0.01" value="0.2"><output></output></label>
    <label><span>Rain</span><input class="amb" id="rain" type="range" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label><span>Night</span><input class="amb" id="night" type="range" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label><span>Crowd</span><input class="amb" id="crowd" type="range" min="0" max="1" step="0.01" value="0"><output></output></label>
  </section>
  <section id="results"><h2>Self-test</h2><button id="runTest">Run offline render test</button><div id="table"></div><pre id="log"></pre></section>
</main>
<script src="../vendor/three.min.js"></script>
<script src="../src/js/00_util.js"></script>
<script src="../src/js/70_sound.js"></script>
<script>
const $ = id => document.getElementById(id);
document.querySelectorAll('input[type=range]').forEach(el => { const o = el.parentElement.querySelector('output'); const f = () => { if (o) o.textContent = (+el.value).toFixed(el.step < 1 ? 2 : 0); }; el.addEventListener('input', f); f(); });
let started = false, bellOn = false, auto = null, pass = null;
$('start').onclick = () => { started = Sound.init(); $('start').textContent = started ? 'Audio running' : 'Web Audio unavailable'; };
$('mute').onclick = () => { Sound.setMuted(!Sound.muted); $('mute').textContent = Sound.muted ? 'Unmute' : 'Mute'; };
$('vol').oninput = e => Sound.setVolume(+e.target.value);
const hornBtn = $('horn'); const hornOn = () => Sound.horn(true), hornOff = () => Sound.horn(false);
hornBtn.addEventListener('pointerdown', hornOn); hornBtn.addEventListener('pointerup', hornOff); hornBtn.addEventListener('pointerleave', hornOff);
$('bell').onclick = () => { bellOn = !bellOn; Sound.bell(bellOn); };
$('chime').onclick = () => Sound.doorChime();
$('announce').onclick = () => Sound.announce($('annText').value);
$('auto').onclick = () => { auto = { t: 0 }; };
$('passEmu').onclick = () => { pass = { t: 0, kind: 'emu' }; };
$('passDsl').onclick = () => { pass = { t: 0, kind: 'diesel' }; };
let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.1, (nowMs - last) / 1000); last = nowMs;
  if (auto) { // 0-20 s accelerate, cruise, then brake to a stop
    auto.t += dt; const t = auto.t; let v = +$('speed').value, p;
    if (t < 25) { p = 1; v = Math.min(30, v + dt * 1.0 * (1 - v / 40)); } else if (t < 32) { p = 0.15; } else { p = -0.8; v = Math.max(0, v - dt * 0.9); if (v === 0) { p = 0; auto = null; } }
    $('speed').value = v; $('power').value = p; $('speed').dispatchEvent(new Event('input')); $('power').dispatchEvent(new Event('input'));
  }
  Sound.train({ kind: $('kind').value, speed: +$('speed').value, power: +$('power').value, onboard: $('onboard').checked, inCab: $('incab').checked,
    tunnel: +$('tunnel').value, doorsOpen: $('doors').checked, curve: +$('curve').value, dist: +$('dist').value });
  Sound.crossings([{ dist: +$('xdist').value, active: $('xon').checked }]);
  if (pass) { pass.t += dt; const d = Math.hypot(15, (pass.t - 5) * 30); Sound.passby({ dist: d, speed: 30, kind: pass.kind, horn: $('passHorn').checked && pass.t > 2.5 && pass.t < 4.8 }); if (pass.t > 10) { pass = null; Sound.passby(null); } }
  const a = {}; document.querySelectorAll('.amb').forEach(el => a[el.id] = +el.value); Sound.ambience(a);
  const E = Sound._engine; if (E) { if (!E.analyser) { E.analyser = E.ctx.createAnalyser(); E.analyser.fftSize = 1024; E.master.connect(E.analyser); E.buf = new Float32Array(1024); }
    E.analyser.getFloatTimeDomainData(E.buf); let s = 0; for (const x of E.buf) s += x * x; const db = 10 * Math.log10(s / E.buf.length + 1e-12); $('meter').firstElementChild.style.width = Math.max(0, Math.min(100, (db + 60) * 1.67)) + '%'; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- offline self-test
function fft(re, im) { const n = re.length; for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) { const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0; for (let k = 0; k < len / 2; k++) { const a = i + k, b = a + len / 2, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
      re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti; const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr; } } } }
function analyze(buf, from = 0) {
  const sr = buf.sampleRate, chs = [...Array(buf.numberOfChannels).keys()].map(c => buf.getChannelData(c)), n = chs[0].length;
  let peak = 0, ss = 0, nan = 0, clipped = 0, maxJump = 0, count = 0;
  for (const a of chs) for (let i = 0; i < n; i++) { const x = a[i]; if (!Number.isFinite(x)) { nan++; continue; } const ax = Math.abs(x); if (ax > peak) peak = ax; if (ax >= 0.999) clipped++; if (i >= from) { ss += x * x; count++; } if (i > 0) { const j = Math.abs(x - a[i - 1]); if (j > maxJump) maxJump = j; } }
  const rmsDb = 10 * Math.log10(ss / Math.max(1, count) + 1e-20);
  // envelope: rms per 0.25 s
  const env = []; const seg = Math.floor(sr * 0.25); for (let s0 = 0; s0 + seg <= n; s0 += seg) { let e = 0; for (let i = s0; i < s0 + seg; i++) e += chs[0][i] * chs[0][i]; env.push(Math.round(10 * Math.log10(e / seg + 1e-20))); }
  // averaged spectrum (mono) from `from` to end
  const N = 8192, mag = new Float64Array(N / 2); let frames = 0;
  for (let s0 = from; s0 + N <= n; s0 += N / 2) { const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < N; i++) { const w = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)); let v = 0; for (const a of chs) v += a[s0 + i]; re[i] = v / chs.length * w; }
    fft(re, im); for (let k = 0; k < N / 2; k++) mag[k] += Math.hypot(re[k], im[k]); frames++; }
  let cen = 0, tot = 0; const peaks = [];
  if (frames) { for (let k = 1; k < N / 2; k++) { const f = k * sr / N; cen += f * mag[k]; tot += mag[k]; }
    for (let k = 3; k < N / 2 - 3; k++) { const m = mag[k]; if (m > mag[k - 1] && m >= mag[k + 1] && m > 1.6 * (mag[k - 3] + mag[k + 3]) / 2) peaks.push([k * sr / N, m]); }
    peaks.sort((a, b) => b[1] - a[1]); }
  const top = []; for (const [f] of peaks) { if (top.every(g => Math.abs(g - f) > 25)) top.push(Math.round(f)); if (top.length >= 6) break; }
  return { peak: +peak.toFixed(3), rmsDb: +rmsDb.toFixed(1), nan, clipped, maxJump: +maxJump.toFixed(3), centroid: tot ? Math.round(cen / tot) : 0, peaks: top, env };
}
async function scenario(name, dur, drive, opts = {}) {
  const sr = 48000, off = new OfflineAudioContext(2, Math.ceil(sr * dur), sr);
  const E = Sound._createEngine(off, { speech: false, live: false, seed: 11 });
  const step = 0.05, times = [];
  for (let t = step; t < dur - 0.01; t += step) times.push(Math.round(t * sr / 128) * 128 / sr);
  [...new Set(times)].forEach(q => off.suspend(q).then(() => { drive(E, q); off.resume(); }));
  drive(E, 0);
  const t0 = performance.now(); const buf = await off.startRendering(); const ms = performance.now() - t0;
  const res = analyze(buf, Math.floor((opts.from || 0) * sr));
  return { name, dur, renderMs: Math.round(ms), rt: +(ms / 1000 / dur).toFixed(3), ...res, expect: opts.expect || 'sound', smoothOk: opts.smooth, tailDb: opts.tailDb };
}
const T = (E, s) => E.train(s);
const SCEN = [
  ['silent: engine created, nothing called', 1.5, () => {}, { expect: 'silence' }],
  ['EMU departs, heard from the platform (8 m)', 4, (E, t) => T(E, { kind: 'emu', speed: Math.min(22, t * 7), power: 1, dist: 8 }), { smooth: true, from: 1 }],
  ['EMU cruise 30 m/s, onboard lower deck', 3, (E, t) => T(E, { kind: 'emu', speed: 30, power: 0.2, onboard: true }), { smooth: true, from: 1 }],
  ['EMU regen braking 25 -> 5 m/s, onboard', 3, (E, t) => T(E, { kind: 'emu', speed: 25 - t * 6.5, power: -0.8, onboard: true }), { smooth: true, from: 0.5 }],
  ['EMU standing, onboard (HVAC, hum)', 2.5, (E, t) => T(E, { kind: 'emu', speed: 0, power: 0, onboard: true }), { smooth: true, from: 1 }],
  ['EMU in cab, 20 m/s power 0.6', 3, (E, t) => T(E, { kind: 'emu', speed: 20, power: 0.6, inCab: true }), { smooth: true, from: 1 }],
  ['diesel notching up from idle, outside 10 m', 4, (E, t) => T(E, { kind: 'diesel', speed: t * 2.5, power: Math.min(1, t / 1.5), dist: 10 }), { smooth: true, from: 1 }],
  ['diesel cruise onboard coach', 3, (E, t) => T(E, { kind: 'diesel', speed: 25, power: 0.8, onboard: true }), { smooth: true, from: 1 }],
  ['diesel dynamic braking, outside', 3, (E, t) => T(E, { kind: 'diesel', speed: 20, power: -1, dist: 12 }), { smooth: true, from: 1 }],
  ['EMU in tunnel, onboard 28 m/s', 3.5, (E, t) => T(E, { kind: 'emu', speed: 28, power: 0.5, onboard: true, tunnel: 1 }), { smooth: true, from: 1.5 }],
  ['rail joints at 25 m/s, outside', 5, (E, t) => T(E, { kind: 'emu', speed: 25, power: 0.3, dist: 6 }), { from: 0.5 }],
  ['flange squeal, tight curve 6 m/s', 3, (E, t) => T(E, { kind: 'emu', speed: 6, power: 0.2, curve: 1, dist: 8 }), { from: 0.5 }],
  ['EMU horn 0.2-1.8 s', 2.6, (E, t) => { T(E, { kind: 'emu', speed: 0, dist: 20 }); E.horn(t >= 0.2 && t < 1.8); }, { from: 0.4 }],
  ['diesel K5LA horn 0.2-1.8 s', 2.6, (E, t) => { T(E, { kind: 'diesel', speed: 0, dist: 20 }); E.horn(t >= 0.2 && t < 1.8); }, { from: 0.4 }],
  ['locomotive bell 0.1-2.2 s', 3, (E, t) => { T(E, { kind: 'diesel', speed: 0, dist: 15 }); E.bell(t >= 0.1 && t < 2.2); }, { from: 0.2 }],
  ['door chime + open/close hiss (onboard)', 3.5, (E, t) => { T(E, { kind: 'emu', speed: 0, onboard: true, doorsOpen: t >= 0.3 && t < 2.3 }); if (Math.abs(t - 0.1) < 0.01) E.doorChime(); }, { from: 0 }],
  ['announcement chime (speech off in test)', 2.8, (E, t) => { if (t === 0) E.announce('Next stop Palo Alto'); }, { from: 0 }],
  ['grade crossings 20 m + 300 m', 3, (E, t) => E.crossings([{ dist: 20, active: true }, { dist: 300, active: true }]), { from: 0.2 }],
  ['EMU pass-by at 30 m/s with horn', 4, (E, t) => E.passby({ dist: Math.hypot(6, (t - 2) * 30), speed: 30, kind: 'emu', horn: t > 1 && t < 2.6 }), { from: 0 }],
  ['diesel pass-by at 25 m/s', 4, (E, t) => E.passby({ dist: Math.hypot(6, (t - 2) * 25), speed: 25, kind: 'diesel' }), { from: 0 }],
  ['ambience: day, bayside station', 4, (E, t) => E.ambience({ city: 0.7, bay: 0.8, wind: 0.5, crowd: 0.6 }), { smooth: true, from: 1.5 }],
  ['ambience: rainy night', 4, (E, t) => E.ambience({ city: 0.3, night: 1, rain: 0.8 }), { from: 1.5 }],
  ['ambience: warm night, crickets', 4, (E, t) => E.ambience({ night: 1, city: 0.1 }), { from: 1.5 }],
  ['bell re-trigger (off at 1.0 s, on again at 1.3 s)', 3, (E, t) => { T(E, { kind: 'diesel', speed: 0, dist: 15 }); E.bell(t < 1.0 || (t >= 1.3 && t < 2.4)); }, { from: 0.2 }],
  ['crossings: five given, nearest three ring, ranks swap', 3, (E, t) => E.crossings([{ dist: 30 + t * 20, active: true }, { dist: 80 - t * 15, active: true }, { dist: 50, active: true }, { dist: 400, active: true }, { dist: 5, active: false }]), { from: 0.2 }],
  ['EMU -> diesel switch at 1.5 s, outside 10 m', 3.5, (E, t) => T(E, { kind: t < 1.5 ? 'emu' : 'diesel', speed: 15, power: 0.5, dist: 10 }), { smooth: true, from: 0.5 }],
  ['train() stops at 1.5 s -> fades out', 3.5, (E, t) => { if (t < 1.5) T(E, { kind: 'emu', speed: 20, power: 0.5, dist: 10 }); else E.tick(); }, { smooth: true, from: 0.5, tailDb: -45 }],
  ['worst case: everything at once', 4, (E, t) => { T(E, { kind: 'diesel', speed: 30, power: 1, dist: 3, tunnel: 1, curve: 1 }); E.horn(true); E.bell(true);
      E.crossings([{ dist: 3, active: true }, { dist: 5, active: true }]); E.passby({ dist: 3, speed: 35, kind: 'emu', horn: true }); E.ambience({ city: 1, bay: 1, wind: 1, rain: 1, night: 1, crowd: 1 }); }, { from: 0.5 }],
];
async function runSelfTest() {
  const out = []; $('log').textContent = 'rendering...';
  for (const [name, dur, drive, opts] of SCEN) {
    let r; try { r = await scenario(name, dur, drive, opts); } catch (e) { r = { name, error: String(e && e.stack || e) }; }
    const fails = [];
    if (r.error) fails.push('error'); else {
      if (r.nan) fails.push('NaN'); if (r.peak >= 0.99) fails.push('clip');
      if (r.expect === 'silence' && r.peak > 1e-6) fails.push('not silent');
      if (r.expect === 'sound' && r.rmsDb < -70) fails.push('too quiet');
      if (r.smoothOk && r.maxJump > 0.25) fails.push('discontinuity');
      if (r.tailDb != null && r.env[r.env.length - 1] > r.tailDb) fails.push('tail too loud');
    }
    r.pass = !fails.length; r.fails = fails; out.push(r); console.log('SELFTEST', JSON.stringify(r));
  }
  // live singleton smoke test (no user gesture in headless: context stays suspended, API must not throw)
  let smoke = 'ok'; try { Sound.init(); Sound.train({ kind: 'emu', speed: 10, power: 0.5 }); Sound.horn(true); Sound.horn(false); Sound.bell(true); Sound.bell(false);
    Sound.doorChime(); Sound.crossings([{ dist: 10, active: true }]); Sound.passby({ dist: 50, speed: 20, kind: 'diesel' }); Sound.ambience({ city: 0.5 }); Sound.setVolume(0.5); Sound.setMuted(true); Sound.setMuted(false); await Sound.announce('test'); } catch (e) { smoke = String(e); }
  const passed = out.filter(r => r.pass).length;
  $('table').innerHTML = '<table><tr><th>scenario</th><th>pass</th><th>rms dB</th><th>peak</th><th>max jump</th><th>centroid Hz</th><th>spectral peaks Hz</th><th>render x RT</th></tr>' +
    out.map(r => `<tr><td>${r.name}</td><td class="${r.pass ? 'ok' : 'bad'}">${r.pass ? 'pass' : r.fails.join(', ')}</td><td>${r.rmsDb}</td><td>${r.peak}</td><td>${r.maxJump}</td><td>${r.centroid}</td><td>${(r.peaks || []).join(' ')}</td><td>${r.rt}</td></tr>`).join('') + '</table>';
  const summary = `SELFTEST DONE ${passed}/${out.length} passed; live API smoke: ${smoke}`;
  $('log').textContent = summary; console.log(summary); document.title = summary; window.__selftest = { out, summary };
  return summary;
}
$('runTest').onclick = runSelfTest;
if (location.hash === '#selftest') runSelfTest();
</script>
</body>
</html>
