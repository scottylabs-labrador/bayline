# Bayline container: nginx serves the single-file game and fronts the multiplayer relay
# (server/mp.py on 127.0.0.1:8765). nginx is the first line of defense: it caps sockets and
# handshake rates per IP before anything reaches Python, and the relay enforces its own caps too.
worker_processes 1;
worker_rlimit_nofile 4096;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=20000 inactive=120s;      # thousands of small tile files
    open_file_cache_valid 60s;
    open_file_cache_errors on;
    keepalive_timeout 30s;
    server_tokens off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # Real client IP. On Sheltie, Coolify's Traefik proxy connects from a private Docker network and
    # passes the visitor's address in X-Forwarded-For; without this every player would share one IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    # Cloudflare's edge, when a site is proxied through it (the real visitor is then the address before Cloudflare's).
    # Ranges from https://www.cloudflare.com/ips (Traefik must trust them too, or it drops the forwarded address).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_conn_zone $binary_remote_addr zone=ws_ip:2m;
    limit_conn_zone $server_name zone=ws_all:1m;
    limit_req_zone $binary_remote_addr zone=ws_hs:2m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=mp_stats:1m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=adsb:2m rate=30r/m;
    proxy_cache_path /tmp/adsb_cache levels=1 keys_zone=adsbc:4m max_size=64m inactive=60s use_temp_path=off;
    resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 3s;
    limit_req_status 429;
    limit_conn_status 503;
    limit_req_log_level notice;      # below error_log's 'warn': a storm must not flood the logs
    limit_conn_log_level notice;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    gzip on;
    gzip_static on;              # index.html.gz is pre-compressed at image build time
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

        location = /ws {
            limit_req zone=ws_hs burst=10 nodelay;   # handshake attempts per IP
            limit_conn ws_ip 4;                      # one above the relay's per-IP cap, so the relay can answer 4003
            limit_conn ws_all 400;                   # hard ceiling of sockets that ever reach Python
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }

        location = /mp/stats {
            limit_req zone=mp_stats burst=10 nodelay;
            proxy_pass http://127.0.0.1:8765/stats;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            add_header Cache-Control "no-store" always;
        }

        # live aircraft positions (adsb.lol, ODbL) for Bayline Flight: browsers can't read adsb.lol directly (no CORS),
        # so a tiny proxy with a strict path, a short shared cache (clients quantise their position so nearby players share
        # entries) and a per-IP rate limit
        location ~ "^/adsb/point/(-?[0-9]{1,2}\.[0-9])/(-?[0-9]{1,3}\.[0-9])/([0-9]{2,3})$" {
            limit_req zone=adsb burst=10 nodelay;
            set $adsb_host api.adsb.lol;
            proxy_pass https://$adsb_host/v2/point/$1/$2/$3;
            proxy_ssl_server_name on;
            proxy_ssl_name api.adsb.lol;
            proxy_set_header Host api.adsb.lol;
            proxy_set_header User-Agent "Bayline flight sim (https://bayline.sheltie.scottylabs.org)";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
            proxy_cache adsbc;
            proxy_cache_key $1/$2/$3;
            proxy_cache_valid 200 4s;
            proxy_cache_valid any 10s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 6s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504 http_429;
            proxy_connect_timeout 4s;
            proxy_read_timeout 8s;
            add_header Cache-Control "no-store" always;
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options nosniff always;
        }

        # streamed world data (tiles, buildings, trees, core files) from the persistent volume.
        # Missing files must 404 (never fall back to index.html), and Range requests must work.
        location ^~ /data/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
            gzip_types application/json text/plain;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
        }
    }
}
