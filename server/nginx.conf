# Bayline container: nginx serves the single-file game and fronts the multiplayer relay
# (server/mp.py on 127.0.0.1:8765). nginx is the first line of defense: it caps sockets and
# handshake rates per IP before anything reaches Python, and the relay enforces its own caps too.
worker_processes 1;
worker_rlimit_nofile 4096;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=20000 inactive=120s;      # thousands of small tile files
    open_file_cache_valid 60s;
    open_file_cache_errors on;
    keepalive_timeout 30s;
    server_tokens off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # Real client IP. On Sheltie, Coolify's Traefik proxy connects from a private Docker network and
    # passes the visitor's address in X-Forwarded-For; without this every player would share one IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_conn_zone $binary_remote_addr zone=ws_ip:2m;
    limit_conn_zone $server_name zone=ws_all:1m;
    limit_req_zone $binary_remote_addr zone=ws_hs:2m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=mp_stats:1m rate=30r/m;
    limit_req_status 429;
    limit_conn_status 503;
    limit_req_log_level notice;      # below error_log's 'warn': a storm must not flood the logs
    limit_conn_log_level notice;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    gzip on;
    gzip_static on;              # index.html.gz is pre-compressed at image build time
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

        location = /ws {
            limit_req zone=ws_hs burst=10 nodelay;   # handshake attempts per IP
            limit_conn ws_ip 4;                      # one above the relay's per-IP cap, so the relay can answer 4003
            limit_conn ws_all 400;                   # hard ceiling of sockets that ever reach Python
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }

        location = /mp/stats {
            limit_req zone=mp_stats burst=10 nodelay;
            proxy_pass http://127.0.0.1:8765/stats;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            add_header Cache-Control "no-store" always;
        }

        # streamed world data (tiles, buildings, trees, core files) from the persistent volume.
        # Missing files must 404 (never fall back to index.html), and Range requests must work.
        location ^~ /data/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
            gzip_types application/json text/plain;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
        }
    }
}
